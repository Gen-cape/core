# scripts/nix-helper.cfg

# --- General Settings ---
# Default flake location relative to the Justfile/project root
DEFAULT_FLAKE_PATH="."

# nixos-anywhere revision (use 'nixpkgs#nixos-anywhere' for latest stable or specify a commit hash)
NIXOS_ANYWHERE_REV="github:nix-community/nixos-anywhere/464b099de84293fa49695b6eb6a7e996c7647b1e"
# Alternative: NIXOS_ANYWHERE_REV="nixpkgs#nixos-anywhere"

# Privilege escalation command (auto-detected, but can be overridden)
# PAMT="sudo" # or "doas"

# --- Color Theme ---
# Using the MGSV-inspired theme. Customize hex codes here.
# Base
COLOR_BG="#1A2026"        # Not directly used in terminal escape codes usually
COLOR_FG="#E0E0E0"        # Default Text (often terminal default)
# ANSI Normal
COLOR_BLACK="#37474F"     # color0
COLOR_RED="#D32F2F"       # color1 - Errors / Critical
COLOR_GREEN="#689F38"     # color2 - Success / Valid
COLOR_YELLOW="#FBC02D"    # color3 - Warnings / Attention
COLOR_BLUE="#546E7A"      # color4 - Secondary Info / Files
COLOR_MAGENTA="#8E24AA"   # color5 - Specific Logs / Roles
COLOR_CYAN="#00ACC1"      # color6 - Primary Accent / Prompts / Active
COLOR_WHITE="#B0BEC5"     # color7 - Secondary Text / Borders
# ANSI Bright
COLOR_BRIGHT_BLACK="#455A64"  # color8 - Comments / Disabled
COLOR_BRIGHT_RED="#E57373"    # color9 - Urgent Errors / Alerts
COLOR_BRIGHT_GREEN="#9CCC65"  # color10 - Significant Success
COLOR_BRIGHT_YELLOW="#FFF176" # color11 - High-Priority Warn / Search
COLOR_BRIGHT_BLUE="#78909C"   # color12 - Highlight Files / Secondary Select
COLOR_BRIGHT_MAGENTA="#BA68C8" # color13 - Distinct Highlighting
COLOR_BRIGHT_CYAN="#4DD0E1"   # color14 - Active Input / Cursor / Primary Highlight
COLOR_BRIGHT_WHITE="#ECEFF1"  # color15 - Max Emphasis Text

# --- Gum Theme (if gum is used) ---
# Set environment variables for gum styling based on the theme above
# Ref: https://github.com/charmbracelet/gum#styling
export GUM_INPUT_CURSOR_FOREGROUND="$COLOR_BRIGHT_CYAN"
export GUM_INPUT_PROMPT_FOREGROUND="$COLOR_CYAN"
export GUM_INPUT_PLACEHOLDER_FOREGROUND="$COLOR_BRIGHT_BLACK"

export GUM_CHOOSE_HEADER_FOREGROUND="$COLOR_CYAN"
export GUM_CHOOSE_CURSOR_FOREGROUND="$COLOR_BRIGHT_CYAN"
export GUM_CHOOSE_ITEM_FOREGROUND="$COLOR_WHITE"
export GUM_CHOOSE_SELECTED_FOREGROUND="$COLOR_BRIGHT_CYAN" # Text color of selected item

export GUM_CONFIRM_PROMPT_FOREGROUND="$COLOR_YELLOW"
export GUM_CONFIRM_SELECTED_FOREGROUND="$COLOR_BRIGHT_CYAN"
export GUM_CONFIRM_UNSELECTED_FOREGROUND="$COLOR_WHITE"

export GUM_SPIN_SPINNER_FOREGROUND="$COLOR_CYAN"
export GUM_SPIN_TITLE_FOREGROUND="$COLOR_WHITE"

export GUM_STYLE_TEXT_FOREGROUND="$COLOR_FG"
export GUM_STYLE_BORDER_FOREGROUND="$COLOR_BLUE"
export GUM_STYLE_BORDER="rounded" # Options: none, hidden, normal, rounded, thick, double

# You can add more gum variables here if needed
