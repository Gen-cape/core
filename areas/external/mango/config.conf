# ---------------------------------------------------------
# Environment Variables
# ---------------------------------------------------------
env=XDG_CURRENT_DESKTOP,Mango
env=XDG_SESSION_DESKTOP,Mango
env=XDG_SESSION_TYPE,wayland
env=GDK_BACKEND,wayland,x11
env=QT_QPA_PLATFORM,wayland;xcb
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto

# ---------------------------------------------------------
# Monitor & Scaling
# ---------------------------------------------------------
# '.*' applies to all displays. Use `wlr-randr` to find specific names (e.g., eDP-1) if needed.
# vrr=1 handles your old `vrr = 1` setting.
monitorrule=name:.*,scale:1.6,vrr:1

# XWayland scaling fix (1.6 * 96 DPI = ~154)
# Mango requires ignoring global scaling for XWayland to prevent blurriness.
xwayland_ignore_scale=1
exec-once=echo "Xft.dpi: 154" | xrdb -merge

# ---------------------------------------------------------
# Autostart
# ---------------------------------------------------------
exec-once=noctalia

# ---------------------------------------------------------
# Input Devices & Sensitivity
# ---------------------------------------------------------
# Keyboard layout
xkb_rules_layout=us,ru
xkb_rules_options=grp:win_space_toggle
repeat_rate=50
repeat_delay=300

# Sensitivity and Trackpad (Maps to your old 'sensitivity = 0.6' and 'scroll_factor = 0.422')
mouse_accel_speed=0.6
trackpad_accel_speed=0.6
trackpad_natural_scrolling=1
trackpad_scroll_factor=0.422

# ---------------------------------------------------------
# Appearance, Gaps, & Effects
# ---------------------------------------------------------
borderpx=2
border_radius=13
blur=1
shadows=1
focused_opacity=1.0

# Gaps
# Mango uses horizontal/vertical outer gaps rather than 4 directional bounds
# gaps_in = 5
gappih=5
gappiv=5
# gaps_out = 12,22,22,22 (Approximated to Mango's uniform outer gap system)
gappoh=22
gappov=12

# ---------------------------------------------------------
# Animations
# ---------------------------------------------------------
animations=1
animation_type_open=slide
animation_duration_open=400

# ---------------------------------------------------------
# Keybindings (SUPER = Windows Key)
# ---------------------------------------------------------
# Core Apps & Actions
#
bind=SUPER+CTRL,s,spawn,sh -c 'satty-screenshot'
bind=SUPER+SHIFT,G,switch_layout
bind=SUPER,w,focusstack,next
bind=SUPER,s,focusstack,prev
bind=SUPER,p,togglefloating
bind=SUPER+SHIFT,p,togglesticky
bind=SUPER+SHIFT,s,spawn,noctalia msg screenshot-region
bind=SUPER+SHIFT,e,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,b,spawn,alacritty -e btop
bind=SUPER,Return,spawn,alacritty
bind=SUPER+SHIFT,q,killclient
bind=SUPER,v,togglefloating
bind=SUPER,f,togglefullscreen
bind=SUPER,r,spawn,noctalia msg panel-toggle launcher
bind=SUPER,t,reload_config
bind=SUPER,e,spawn,alacritty -e yazi
bind=SUPER,o,spawn,alacritty -e nvim ~/.config/mango/config.conf
# Focus Movement (Mango uses Arrow Keys by default, mirroring your Hyprland binds)
bind=SUPER,left,focusdir,l
bind=SUPER,right,focusdir,r
bind=SUPER,up,focusdir,u
bind=SUPER,down,focusdir,d
bind=SUPER, z, spawn, alacritty

# Basic Tag (Workspace) Switching
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10

# Move Window to Tag (Workspace)
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10

# ---------------------------------------------------------
# Hijacker Controls
# ---------------------------------------------------------
bind=SUPER+ALT,h,spawn,sh -c 'hijacker-ctl toggle'
bind=SUPER+ALT,0,spawn,pkill hijacker2
bind=SUPER+ALT,1,spawn,sh -c 'hijacker-ctl play 1'
bind=SUPER+ALT,2,spawn,sh -c 'hijacker-ctl play 2'
bind=SUPER+ALT,3,spawn,sh -c 'hijacker-ctl play 3'
bind=SUPER+ALT,4,spawn,sh -c 'hijacker-ctl play 4'
bind=SUPER+ALT,5,spawn,sh -c 'hijacker-ctl play 5'
bind=SUPER+ALT,6,spawn,sh -c 'hijacker-ctl play 6'
bind=SUPER+ALT,7,spawn,sh -c 'hijacker-ctl play 7'
bind=SUPER+ALT,8,spawn,sh -c 'hijacker-ctl play 8'
bind=SUPER+ALT,9,spawn,sh -c 'hijacker-ctl play 9'
# bind=SUPER+ALT,h,spawn,noctalia msg notification-show 'Keybind' 'Working'

# Media / Brightness Controls 
# (Using NONE modifier allows these to work instantly like 'bindle' in Hyprland)
bind=NONE,XF86AudioRaiseVolume,spawn,pamixer -i 5 --allow-boost --set-limit 200
bind=NONE,XF86AudioLowerVolume,spawn,pamixer -d 5 --allow-boost --set-limit 200
bind=NONE,XF86AudioMute,spawn,pamixer -t
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -c backlight s 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -c backlight s 5%-
bind=NONE,Print,spawn,grim - | wl-copy

# Mouse Bindings for Dragging/Resizing (Equivalent to bindm)

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

source=~/.config/mango/noctalia.conf
