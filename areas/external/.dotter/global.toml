# Path to your dotfile directory containing this config file (relative to $HOME) is: core/areas/external

[settings]
default_target_type = "symbolic"

[kanata.files]
"kanata" = "~/.config/kanata"

[ghostty.files]
"ghostty" = "~/.config/ghostty"

[walls.files]
"walls/wall.gif" = "~/wall.gif"
"walls/.current_wallpaper.png" = "~/.current_wallpaper.png"
"walls/wall.png" = "~/wall.png"

[makima.files]
"makima" = "~/.config/makima"

[direnv.files]
"misc/direnv.toml" = "~/.config/direnv/direnv.toml"

[bundle]
depends = ["kanata", "ghostty", "walls", "makima", "direnv"]
