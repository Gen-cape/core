# Path to your dotfile directory containing this config file (relative to $HOME) is: core/areas/external
# left = what, right = where to.

[settings]
default_target_type = "symbolic"

[main.files]
"mango" = "~/.config/mango/"
"kanata" = "~/.config/kanata"
"ghostty" = "~/.config/ghostty"
"misc/direnv.toml" = "~/.config/direnv/direnv.toml"
"rofi" = "~/.config/rofi"
"hyprland" = "~/.config/hypr"
"noctalia" = "~/.config/noctalia"
"./noctalia" = "~/.local/state/noctalia" # This trick OMG. ./././././ for more chains
"just" = "~/.config/just"
"fish/functions/mkcd.fish" = "~/.config/fish/functions/mkcd.fish"
"fish/config.fish" = "~/.config/fish/config.fish"
"starship/starship.toml" = "~/.config/starship.toml"
"kde/kdeglobals" = "~/.config/kdeglobals"
"nix-init/config.toml" = "~/.config/nix-init/config.toml"
"vale/.vale.ini" = "~/.config/vale/.vale.ini"
"prettypst/prettypst.toml" = "~/.config/prettypst/prettypst.toml"
"alacritty" = "~/.config/alacritty"
"xdg/mimeapps.list" = "~/.config/mimeapps.list"
"xdg/xdg-terminals.list" = "~/.config/xdg-terminals.list"
"mpv" = "~/.config/mpv"
"zathura" = "~/.config/zathura"
"nvim" = "~/.config/nvim"
"yazi" = "~/.config/yazi"
"umbriel" = "~/.config/umbriel"
# DONT FORGET TO UPDATE THESE!!!!!!!!!!!


[bundle]
depends = [ "main" ] # keeping it that way so I can inject more experimental profiles
