# Put this in ~/.config/makima and rename it to the exact name of your device as shown by the 'evtest' command
# Example Name: 8BitDo Ultimate Wireless  Pro 2 Wired Controller.toml

[remap]
# Remap standard buttons (except the macro trigger BTN_THUMBR) to themselves.
BTN_NORTH = ["BTN_NORTH"]
# BTN_WEST = ["BTN_WEST"] # No longer used for macro
BTN_SOUTH = ["BTN_SOUTH"]
BTN_EAST = ["BTN_EAST"]
BTN_TR = ["BTN_TR"] # Right Bumper
BTN_TL = ["BTN_TL"] # Left Bumper
BTN_START = ["BTN_START"]
BTN_SELECT = ["BTN_SELECT"]
# BTN_THUMBR = ["BTN_THUMBR"] # Commented out: Handled entirely by the command below when GRAB_DEVICE=true
BTN_THUMBL = ["BTN_THUMBL"] # Left Stick Click
BTN_MODE = ["BTN_MODE"] # Home/Guide button
BTN_DPAD_UP = ["BTN_DPAD_UP"]
BTN_DPAD_RIGHT = ["BTN_DPAD_RIGHT"]
BTN_DPAD_DOWN = ["BTN_DPAD_DOWN"]
BTN_DPAD_LEFT = ["BTN_DPAD_LEFT"]

# NOTE: DO NOT add ABS_ lines here.

[commands]
# Pressing BTN_THUMBR runs the toggle script to start or stop the looping macro.
# Assumes Makima is running with root privileges to execute evemu-event inside the script.
# Make sure the script path is correct and the script is executable.
BTN_THUMBR = ["bash /home/john/.config/makima/makima_toggle_loop.sh"]

# Remove or comment out the old BTN_WEST command:
# BTN_WEST = ["sh -c '...'"]


[settings]
# --- Controller Specific Settings ---
# 16_BIT_AXIS = "false" # Assuming 8-bit triggers (0-255), check evtest output
STADIA = "false"

# --- General Settings ---
# GRAB_DEVICE: Must be "true" so that the original BTN_THUMBR press doesn't
# reach applications and only triggers our script. This also prevents the
# user from needing to map BTN_THUMBR in [remap].
GRAB_DEVICE = "false"

# LAYOUT_SWITCHER = "BTN_MODE"
# NOTIFY_LAYOUT_SWITCH = "true"
CHAIN_ONLY = "true"

# --- Analog Stick Configuration (Examples, uncomment and adjust if needed) ---
# LSTICK = "cursor"
# RSTICK = "scroll"
# LSTICK_SENSITIVITY = "6"
# RSTICK_SENSITIVITY = "6"
# LSTICK_DEADZONE = "10"
# RSTICK_DEADZONE = "10"
# CURSOR_SPEED = "10"
# SCROLL_SPEED = "10"
