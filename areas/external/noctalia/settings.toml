[plugin_settings."noctalia/notes"]
panel_position = "center"

[plugins]
enabled = [
    "noctalia/bongocat",
    "noctalia/notes",
    "detluck/performance-plus",
    "noctalia/umbriel-companion",
    "noctalia/kaomoji",
    "reaperhound/ambient-sounds",
    "noctalia/wallhaven"
]

[shell]
font_family = "DepartureMono Nerd Font Mono"
polkit_agent = true

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Frappe Rosewater"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [
        "alacritty",
        "btop",
        "foot",
        "gtk3",
        "gtk4",
        "ghostty",
        "kcolorscheme",
        "kitty",
        "mango",
        "qt",
        "scroll",
        "starship",
        "wezterm"
    ]
    community_ids = [
        "spicetify",
        "zen-browser",
        "discord",
        "telegram",
        "vscode",
        "zed",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "fastfetch",
        "zathura",
        "fzf",
        "yazi"
    ]

[wallpaper.default]
path = "/home/john/Pictures/wallhaven-vp23lp.png"

[wallpaper.last]
path = "/home/john/Pictures/wallhaven-vp23lp.png"

[wallpaper.monitors.eDP-1]
path = "/home/john/Pictures/wallhaven-vp23lp.png"

[widget.audio_visualizer]
enabled = false

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.cat]
input_devices = [ "/dev/input/by-path/platform-i8042-serio-0-event-kbd" ]
type = "noctalia/bongocat:cat"

[widget.cat1]
type = "noctalia/bongocat:cat"

[widget.clock]
anchor = true
color = "#ECE5D8"
format = "⟨ %a ✦ %d %b ⟩ ·「%H:%M」"
icon_color = "#E3B342"
scale = 1.2

[widget.control-center]
glyph = "snowflake"

[widget.indicator]
type = "detluck/performance-plus:indicator"

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.network]
show_vpn_label = true

[widget.notes]
type = "noctalia/notes:notes"

[widget.notifications]
hide_when_no_unread = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
labels_only_when_occupied = true
style = "focus_hint"
