config_version = 15

[accessibility]
ui_scale = 1.2

[audio]
enable_overdrive = true

[bar.default]
capsule = true
center = [ "group:g4", "clock", "cat", "notifications" ]
concave_edge_corners = false
end = [ "group:g2", "network", "battery", "group:g3" ]
font_family = "DepartureMono Nerd Font Mono"
padding = 10
radius = 8
start = [ "launcher", "bar", "workspaces", "group:g1" ]
thickness = 28

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.5
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "notes", "wallpaper", "wallhaven", "kaomoji", "ambient-sounds" ]
    opacity = 0.78000000000000003
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    border_width = 1.5
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "volume", "input_volume", "brightness", "bluetooth", "power_profile", "indicator" ]
    opacity = 0.78000000000000003
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "start"
    border_width = 1.5
    enabled = true
    fill = "surface_variant"
    foreground = "on_secondary"
    id = "g3"
    members = [ "tray", "session", "control-center" ]
    opacity = 0.84999999999999998
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.5
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "media", "audio_visualizer" ]
    opacity = 0.84999999999999998
    padding = 6.0

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1000.0
    cy = 1136.25
    output = "eDP-1"
    placement_height = 1250.0
    placement_width = 2000.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugin_settings."noctalia/notes"]
panel_position = "center"

[plugins]
enabled = [
    "noctalia/bongocat",
    "noctalia/notes",
    "detluck/performance-plus",
    "noctalia/kaomoji",
    "noctalia/wallhaven",
    "alexander/screen-toolkit"
]

[shell]
font_family = "DepartureMono Nerd Font Mono"
polkit_agent = true

    [shell.launcher]
    category_icons_only = true
    layout = "simple"

    [shell.panel]
    transparency_mode = "glass"

    [shell.screenshot]
    directory = "/home/john/Pictures/screenshots"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Frappe Rosewater"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [
        "alacritty",
        "btop",
        "foot",
        "gtk3",
        "gtk4",
        "ghostty",
        "kcolorscheme",
        "kitty",
        "mango",
        "qt",
        "scroll",
        "starship",
        "wezterm"
    ]
    community_ids = [
        "spicetify",
        "zen-browser",
        "discord",
        "telegram",
        "vscode",
        "zed",
        "heroiclauncher",
        "prismlauncher",
        "steam",
        "fastfetch",
        "zathura",
        "fzf",
        "yazi"
    ]

[wallpaper.default]
path = "/home/john/Pictures/wallhaven-vp23lp.png"

[wallpaper.last]
path = "/home/john/Pictures/wallhaven-vp23lp.png"

[wallpaper.monitors.eDP-1]
path = "/home/john/Pictures/wallhaven-vp23lp.png"

[[wallpaper.favorite]]
palette_source = "wallpaper"
path = "/home/john/Pictures/wallhaven-vp23lp.png"
theme_mode = "dark"
wallpaper_scheme = "m3-rainbow"

[widget.ambient-sounds]
type = "reaperhound/ambient-sounds:ambient-sounds"

[widget.audio_visualizer]
enabled = true

[widget.bar]
type = "noctalia/umbriel-companion:bar"

[widget.cat]
audio_spectrum = true
input_devices = [ "/dev/input/by-path/platform-i8042-serio-0-event-kbd" ]
tappy_mode = true
type = "noctalia/bongocat:cat"
use_mpris_filter = true

[widget.clock]
anchor = true
color = "#ECE5D8"
format = "⟨ %a ✦ %d %b ⟩ ∷「%H:%M」//·"
icon_color = "#E3B342"
scale = 1.1499999999999999

[widget.control-center]
glyph = "snowflake"

[widget.indicator]
type = "detluck/performance-plus:indicator"

[widget.kaomoji]
type = "noctalia/kaomoji:kaomoji"

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.network]
show_vpn_label = true

[widget.notes]
type = "noctalia/notes:notes"

[widget.notifications]
hide_when_no_unread = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.workspaces]
labels_only_when_occupied = false
style = "focus_hint"